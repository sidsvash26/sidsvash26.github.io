<style>
  .timeline-container {
    margin: 10px 0;
    padding: 20px 0;
  }
  
  .timeline {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin: 60px 0;
    padding: 0 20px;
    flex-wrap: nowrap;
  }
  
  .timeline::before {
    content: '';
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #007bff, #28a745, #ffc107, #dc3545, #6f42c1, #fd7e14);
    z-index: 1;
  }
  
  .timeline-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
    flex: 1;
    margin: 0 6px;
    min-width: 90px;
    margin-bottom: 30px;
    transition: all 0.3s ease;
  }
  
  .timeline-logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: white;
    border: 4px solid #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    transition: box-shadow 0.3s, border-color 0.3s, transform 0.3s;
    cursor: pointer;
    position: relative;
  }
  .timeline-logo:hover, .timeline-logo:focus {
    transform: scale(1.08);
    box-shadow: 0 8px 25px rgba(0,123,255,0.18);
    z-index: 2;
  }
  .timeline-logo .timeline-tooltip {
    display: none;
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    background: #222;
    color: #fff;
    font-size: 0.85em;
    padding: 4px 10px;
    border-radius: 6px;
    margin-top: 8px;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }
  .timeline-logo:hover .timeline-tooltip,
  .timeline-logo:focus .timeline-tooltip {
    display: block;
  }
  
  .timeline-logo img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
  }
  
  .timeline-year {
    font-weight: bold;
    font-size: 1.1em;
    color: var(--global-text-color, #333);
    margin-bottom: 4px;
    text-align: center;
  }
  
  .timeline-company {
    font-weight: 600;
    font-size: 0.9em;
    color: var(--global-text-color, #666);
    text-align: center;
    margin-bottom: 2px;
  }
  
  .timeline-position {
    font-size: 0.8em;
    color: var(--global-text-color, #888);
    text-align: center;
    font-style: italic;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .timeline-details-wide {
    display: none;
    background: var(--global-card-bg-color, #fff);
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    width: 95vw;
    max-width: 500px;
    margin: 12px auto 0 auto;
    z-index: 20;
    text-align: left;
    color: var(--global-text-color, #222);
    position: relative;
    transition: max-height 0.3s, opacity 0.3s;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    padding-top: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 1.5px 8px rgba(0,123,255,0.08);
    border: 2px solid transparent;
    animation: fadeSlideIn 0.35s cubic-bezier(.4,0,.2,1);
  }
  
  .timeline-item.active .timeline-details-wide {
    display: block;
    opacity: 1;
    max-height: 400px;
    transition: max-height 0.3s, opacity 0.3s;
  }
  
  .timeline-details-wide h4 {
    margin: 0 0 8px 0;
    color: var(--global-text-color, #333);
    font-size: 1em;
  }
  
  .timeline-details-wide p {
    margin: 0;
    font-size: 0.95em;
    line-height: 1.5;
    color: var(--global-text-color, #666);
  }
  
  .timeline-details-wide a {
    color: #007bff;
    text-decoration: none;
  }
  
  .timeline-details-wide a:hover {
    text-decoration: underline;
  }
  
  .timeline-clickme {
    font-size: 0.9em;
    color: #007bff;
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 6px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
  }
  
  .timeline-clickme:hover {
    background: #e3eaff;
  }
  
  .timeline-item.active .timeline-logo {
    box-shadow: 0 0 0 4px rgba(0,123,255,0.18), 0 8px 25px rgba(0,123,255,0.12);
    border-color: #007bff;
    transform: scale(1.10);
  }
  
  .timeline-details-arrow {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 18px;
    z-index: 2;
    pointer-events: none;
  }
  
  .timeline-details-arrow svg {
    display: block;
  }
  
  /* Responsive design */
  @media (max-width: 900px) {
    .timeline {
      flex-direction: column;
      align-items: flex-start;
      gap: 30px;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 60px;
      top: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, #007bff, #28a745, #ffc107, #dc3545, #6f42c1, #fd7e14);
      z-index: 1;
    }
    .timeline-item {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      width: 100%;
      min-width: 0;
      margin-bottom: 40px;
      position: relative;
      background: none;
      z-index: 2;
    }
    .timeline-year-col {
      flex: 0 0 60px;
      text-align: right;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      z-index: 2;
    }
    .timeline-year {
      font-size: 1em;
      color: var(--global-text-color, #888);
      margin-top: 18px;
      margin-bottom: 0;
      text-align: right;
    }
    .timeline-logo-col {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      min-width: 0;
      position: relative;
      z-index: 2;
    }
    .timeline-logo {
      margin: 0 0 8px 0;
      align-self: flex-start;
      left: 0;
      z-index: 2;
    }
    .timeline-position {
      font-size: 0.98em;
      color: var(--global-text-color, #007bff);
      text-align: left;
      margin-bottom: 0;
      margin-left: 0;
      margin-top: 0;
      font-style: italic;
      font-weight: 500;
      padding-left: 0;
      z-index: 2;
    }
    .timeline-company {
      display: none;
    }
    .timeline-details-wide {
      width: 100vw;
      max-width: 100vw;
      left: 0;
      margin: 10px 0 0 0;
      border-radius: 10px;
      background: var(--global-card-bg-color, #fff);
      color: var(--global-text-color, #222);
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1.5px solid #e9ecef;
      position: relative;
      z-index: 20;
      padding-top: 24px;
      padding-left: 18px;
      padding-right: 18px;
      animation: fadeSlideIn 0.35s cubic-bezier(.4,0,.2,1);
    }
    .timeline-details-arrow {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 18px;
      z-index: 2;
      pointer-events: none;
    }
    .timeline-details-arrow svg {
      display: block;
    }
  }
  [data-theme="dark"] .timeline-details-wide {
    background: #23272f;
    color: #e2e8f0;
    border-color: #444;
  }
  [data-theme="dark"] .timeline-details-wide h4 {
    color: #e2e8f0;
  }
  [data-theme="dark"] .timeline-details-wide p {
    color: #b0b8c1;
  }
  [data-theme="dark"] .timeline-company, [data-theme="dark"] .timeline-year, [data-theme="dark"] .timeline-position {
    color: #b0b8c1;
  }
  .timeline-connector {
    display: none;
    position: absolute;
    width: 0;
    border-left: 3px solid rgba(0,123,255,0.35);
    z-index: 15;
    pointer-events: none;
    transition: top 0.3s, left 0.3s, height 0.3s;
  }
  @media (max-width: 900px) {
    .timeline-connector {
      display: none !important;
    }
  }
  .timeline-connector-svg {
    display: none;
    position: absolute;
    pointer-events: none;
    z-index: 15;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
// Timeline click-to-expand for both desktop and mobile
const items = document.querySelectorAll('.timeline-item');
const popupRow = document.getElementById('timeline-popup-row');
let activeIndex = null;
const detailsData = [
  {
    h4: 'Google Deepmind',
    html: 'Working on developing AI agents with Gemini. Present focus: <a href="https://gemini.google/overview/deep-research/?hl=en">Gemini Deep Research</a>.'
  },
  {
    h4: 'Google Gemini',
    html: 'Developing advanced AI models for tool use in Gemini.'
  },
  {
    h4: 'Google Assistant',
    html: 'Conducted research on parsing realistic task-oriented dialogs. Published and presented a <a href="https://aclanthology.org/2023.emnlp-main.667/">paper</a> at EMNLP 2023.'
  },
  {
    h4: 'Verneek.ai',
    html: 'Developed NLP models on semantic parsing and closed-domain natural language generation.'
  },
  {
    h4: 'Amazon Alexa AI',
    html: 'Worked with Alexa NLU team on Cross-Lingual Transfer Learning.'
  },
  {
    h4: 'EXL Analytics',
    html: 'Worked on multiple projects with various retail banking clients on: report automation with SAS and Excel VBA, engineering features and developing ML models on customer data for mitigating risk in credit card portfolios.'
  }
];
function positionConnector(idx) { /* no-op */ }
items.forEach((item, idx) => {
  const logo = item.querySelector('.timeline-logo');
  if (logo) {
    logo.addEventListener('click', function(e) {
      // Hide tooltip immediately on click
      const tooltip = logo.querySelector('.timeline-tooltip');
      if (tooltip) tooltip.style.display = 'none';
      e.stopPropagation();
      if (activeIndex === idx) {
        activeIndex = null;
        popupRow.innerHTML = '';
        items.forEach(i => i.classList.remove('active'));
      } else {
        activeIndex = idx;
        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        // Desktop: show popup below timeline
        if (window.innerWidth > 900) {
          popupRow.innerHTML = `<div class='timeline-details-wide' style='display:block;opacity:1;max-height:400px;'>
            <div class='timeline-details-arrow'><svg width='28' height='18'><polygon points='14,0 28,18 0,18' fill='#fff' stroke='#007bff' stroke-width='2'/></svg></div>
            <h4>${detailsData[idx].h4}</h4>
            <p>${detailsData[idx].html}</p>
          </div>`;
        } else {
          popupRow.innerHTML = '';
        }
      }
      setTimeout(() => positionConnector(idx), 10);
    });
    logo.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        logo.click();
      }
    });
  }
});
document.addEventListener('click', function(e) {
  if (!e.target.classList.contains('timeline-logo') && !e.target.classList.contains('timeline-tooltip')) {
    activeIndex = null;
    popupRow.innerHTML = '';
    items.forEach(i => i.classList.remove('active'));
  }
});
// On mobile, show the popup directly below the logo-col, full width, with arrow at top center
function showMobilePopup(idx) {
  const item = items[idx];
  const logoCol = item.querySelector('.timeline-logo-col');
  if (!logoCol) return;
  // Remove any existing popups
  document.querySelectorAll('.timeline-details-wide').forEach(el => el.remove());
  // Insert popup after logoCol
  const div = document.createElement('div');
  div.className = 'timeline-details-wide';
  div.innerHTML = `<div class='timeline-details-arrow'><svg width='28' height='18'><polygon points='14,0 28,18 0,18' fill='#fff' stroke='#007bff' stroke-width='2'/></svg></div><h4>${detailsData[idx].h4}</h4><p>${detailsData[idx].html}</p>`;
  logoCol.insertAdjacentElement('afterend', div);
}
items.forEach((item, idx) => {
  const logo = item.querySelector('.timeline-logo');
  if (logo) {
    logo.addEventListener('click', function(e) {
      const tooltip = logo.querySelector('.timeline-tooltip');
      if (tooltip) tooltip.style.display = 'none';
      e.stopPropagation();
      if (window.innerWidth > 900) {
        // Desktop: show popup below timeline as before
        activeIndex = idx;
        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        popupRow.innerHTML = `<div class='timeline-details-wide' style='display:block;opacity:1;max-height:400px;'><div class='timeline-details-arrow'><svg width='28' height='18'><polygon points='14,0 28,18 0,18' fill='#fff' stroke='#007bff' stroke-width='2'/></svg></div><h4>${detailsData[idx].h4}</h4><p>${detailsData[idx].html}</p></div>`;
      } else {
        // Mobile: show popup below logo-col
        showMobilePopup(idx);
      }
    });
    logo.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        logo.click();
      }
    });
  }
});
document.addEventListener('click', function(e) {
  if (!e.target.classList.contains('timeline-logo') && !e.target.classList.contains('timeline-tooltip')) {
    activeIndex = null;
    popupRow.innerHTML = '';
    items.forEach(i => i.classList.remove('active'));
    // Remove mobile popups
    document.querySelectorAll('.timeline-details-wide').forEach(el => el.remove());
  }
});
// On mobile, show/hide details inside the item as before
function handleResize() {
  if (window.innerWidth <= 900) {
    items.forEach((item, idx) => {
      const details = item.querySelector('.timeline-details-wide');
      if (!details) {
        const rightCol = item.querySelector('.timeline-right-col');
        if (rightCol) {
          const div = document.createElement('div');
          div.className = 'timeline-details-wide';
          div.innerHTML = `<h4>${detailsData[idx].h4}</h4><p>${detailsData[idx].html}</p>`;
          rightCol.appendChild(div);
        }
      }
    });
    popupRow.innerHTML = '';
  } else {
    // Remove mobile details
    items.forEach(item => {
      const details = item.querySelector('.timeline-details-wide');
      if (details) details.remove();
    });
  }
}
window.addEventListener('resize', function() {
  handleResize();
});
document.addEventListener('DOMContentLoaded', function() {
  handleResize();
});
</script>
