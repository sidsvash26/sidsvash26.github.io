<!-- Visitor counter at the very end -->
<div class="visitor-counter" style="text-align:center;margin-top:60px;padding:20px;border-top:1px solid var(--global-divider-color,#e9ecef);background-color:var(--global-card-bg-color,#f8f9fa);color:var(--global-text-color,#6c757d);font-size:0.9em;">
  <span class="date-line" style="color:var(--global-text-color,#6c757d);">Total global website visits:</span>
  <span id="visitor-count-value" style="font-weight:600;color:var(--global-text-color,#495057);margin-left:5px;">Loading...</span>
</div>

<script>
  $(document).ready(function() {
    const counterEl = document.getElementById('visitor-count-value');
    if (counterEl) {
      fetch('https://api.counterapi.dev/v1/sidsvash26/global/up')
        .then(res => res.json())
        .then(data => {
          if (data && data.value) {
            counterEl.textContent = Number(data.value).toLocaleString();
          }
        })
        .catch(err => {
          console.error('Failed to load visitor counter:', err);
          counterEl.textContent = '10,000+'; // elegant fallback
        });
    }
  });
</script>
