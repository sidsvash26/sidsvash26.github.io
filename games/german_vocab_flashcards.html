<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Vocabulary Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        button, select { transition: all 0.2s ease-in-out; }
        button:hover:not(:disabled), select:hover { opacity: 0.85; }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Flashcard styles */
        .flashcard-container { perspective: 1000px; min-height: 250px; margin-bottom: 1rem; }
        .flashcard { width: 100%; height: 250px; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .flashcard.is-flipped { transform: rotateY(180deg); cursor: default; }
        .flashcard.no-interaction { pointer-events: none; cursor: default; }
        .flashcard-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
            border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
        }
        .flashcard-front { background-color: #ffffff; color: #1f2937; }
        .flashcard-back { background-color: #4b5563; color: #ffffff; transform: rotateY(180deg); }

        /* Word display and speaker button container */
        .word-container { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; max-width: 90%; }
        .word-display { font-size: 1.875rem; line-height: 2.25rem; font-weight: 700; text-align: center; overflow-wrap: break-word; word-break: break-word; flex-shrink: 1; }
        .example-sentence { font-size: 1rem; line-height: 1.5rem; font-style: italic; color: #e5e7eb; }

        /* Speaker button styles */
        .speak-button { background: none; border: none; padding: 0.25rem; cursor: pointer; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s ease; flex-shrink: 0; }
        .speak-button:hover { background-color: rgba(0, 0, 0, 0.1); }
        .speak-button svg { width: 1.25rem; height: 1.25rem; }
        .flashcard-front .speak-button svg { fill: #4b5563; }
        .flashcard-back .speak-button svg { fill: #ffffff; }
        .speak-button.hidden { display: none; }

        /* Loading indicator */
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Smooth hide/show */
        .hidden-smooth { opacity: 0; visibility: hidden; height: 0; margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; transition: opacity 0.3s ease, visibility 0.3s ease, height 0.3s ease, margin 0.3s ease, padding 0.3s ease; overflow: hidden; }
        .visible-smooth { opacity: 1; visibility: visible; height: auto; margin-top: 0.5rem; transition: opacity 0.3s ease 0.1s, visibility 0.3s ease 0.1s, height 0.3s ease 0.1s, margin 0.3s ease 0.1s, padding 0.3s ease 0.1s; }

        /* Status display */
         #card-status-display { font-weight: 500; }
         .status-correct { color: #16a34a; } .status-wrong { color: #dc2626; }
         .card-status-base { text-align: center; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg w-full max-w-2xl mx-auto">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-8">German Vocabulary Flashcards</h1>

        <div id="loading" class="text-center text-gray-600 my-10"> <div class="loader"></div> Loading vocabulary... </div>
        <div id="error-message" class="hidden text-center text-red-600 mb-6 p-3 bg-red-100 rounded-lg"></div>
        <div id="tts-warning" class="hidden text-center text-orange-600 mb-6 p-3 bg-orange-100 rounded-lg text-sm"> Text-to-speech may not be supported or fully functional on this browser. </div>

        <div id="controls" class="hidden mb-8 p-4 border border-gray-200 rounded-lg bg-gray-50">
             <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 md:gap-6">
                 <div class="flex-1 min-w-0"> <label for="chapter-select" class="block text-sm font-medium text-gray-700 mb-1">Chapter:</label> <select id="chapter-select" name="chapter" class="w-full mt-1 block pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md shadow-sm cursor-pointer"> <option value="all">All Chapters</option> </select> </div>
                 <fieldset class="flex-shrink-0"> <legend class="block text-sm font-medium text-gray-700 mb-1 md:text-center">Direction:</legend> <div class="flex items-center justify-start md:justify-center space-x-4 mt-1"> <div class="flex items-center"> <input id="eng-to-ger" name="direction" type="radio" value="eng-ger" checked class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300 cursor-pointer"> <label for="eng-to-ger" class="ml-2 block text-sm text-gray-900 cursor-pointer">ENG → GER</label> </div> <div class="flex items-center"> <input id="ger-to-eng" name="direction" type="radio" value="ger-eng" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300 cursor-pointer"> <label for="ger-to-eng" class="ml-2 block text-sm text-gray-900 cursor-pointer">GER → ENG</label> </div> </div> </fieldset>
                 <div class="flex-shrink-0 mt-2 md:mt-0 self-center md:self-end"> <button id="shuffle-button" class="w-full md:w-auto px-4 py-2 bg-purple-600 text-white rounded-md shadow hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 text-sm font-medium"> Shuffle Deck </button> </div>
             </div>
        </div>

        <div id="flashcard-area" class="hidden mb-6">
            <div id="flashcard-container" class="flashcard-container">
                <div id="flashcard" class="flashcard">
                    <div class="flashcard-face flashcard-front">
                        <div class="word-container">
                             <span id="card-front-content" class="word-display">Loading...</span>
                             <button id="speak-front-button" class="speak-button hidden" aria-label="Speak word">
                                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.945.945 2.56.276 2.56-1.06V4.06ZM18.584 12c0-1.841-1.493-3.333-3.333-3.333v-1.5c2.66 0 4.833 2.173 4.833 4.833s-2.173 4.833-4.833 4.833v-1.5c1.84 0 3.333-1.492 3.333-3.333Z"></path><path d="M15.251 6.096a6.5 6.5 0 0 1 0 11.808v-1.5a5 5 0 0 0 0-8.808v-1.5Z"></path></svg>
                             </button>
                        </div>
                        </div>
                    <div class="flashcard-face flashcard-back">
                         <div class="word-container">
                              <span id="card-back-translation" class="word-display"></span>
                              <button id="speak-back-button" class="speak-button hidden" aria-label="Speak word">
                                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.66 1.905H6.44l4.5 4.5c.945.945 2.56.276 2.56-1.06V4.06ZM18.584 12c0-1.841-1.493-3.333-3.333-3.333v-1.5c2.66 0 4.833 2.173 4.833 4.833s-2.173 4.833-4.833 4.833v-1.5c1.84 0 3.333-1.492 3.333-3.333Z"></path><path d="M15.251 6.096a6.5 6.5 0 0 1 0 11.808v-1.5a5 5 0 0 0 0-8.808v-1.5Z"></path></svg>
                              </button>
                         </div>
                         <span id="card-back-example" class="example-sentence"></span>
                    </div>
                </div>
            </div>

             <div id="card-status-display" class="card-status-base hidden-smooth h-6"></div>
             <div id="assessment-controls" class="assessment-controls hidden-smooth text-center mt-4 space-y-3">
                 <p class="text-sm text-gray-600 italic">Be truthful to yourself!</p>
                 <div class="flex justify-center items-center gap-3 sm:gap-4">
                     <button id="correct-button" class="px-4 py-2 sm:px-5 sm:py-2 bg-green-600 text-white rounded-md shadow hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 text-sm sm:text-base"> I knew it! 👍 </button>
                     <button id="wrong-button" class="px-4 py-2 sm:px-5 sm:py-2 bg-red-600 text-white rounded-md shadow hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 text-sm sm:text-base"> Didn't know 👎 </button>
                 </div>
            </div>
        </div>

        <div id="navigation-area" class="hidden mt-8 pt-4 border-t border-gray-200">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                 <div class="text-center sm:text-left"> <span id="card-counter" class="text-sm text-gray-600 mr-4">Card 0 of 0</span> <span id="score-display" class="text-sm font-medium text-indigo-700">Score: 0 / 0</span> </div>
                 <div class="flex justify-center items-center space-x-3 w-full sm:w-auto"> <button id="prev-button" class="flex-1 sm:flex-none px-4 py-2 sm:px-6 bg-gray-500 text-white rounded-md shadow hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 text-sm font-medium"> Previous </button> <button id="next-button" class="flex-1 sm:flex-none px-4 py-2 sm:px-6 bg-indigo-600 text-white rounded-md shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 text-sm font-medium"> Next </button> </div>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQEmR6UEXuebbHyZ66KbVf_hbJwU_Gwj9qkkzmRjGh9wLebiYXvCMBB3ukupbhXCP4mF5VJCuh3im3H/pub?gid=0&single=true&output=csv';

        // --- DOM Elements ---
        const loadingIndicator = document.getElementById('loading');
        const errorMessageDiv = document.getElementById('error-message');
        const ttsWarningDiv = document.getElementById('tts-warning');
        const controlsDiv = document.getElementById('controls');
        const flashcardAreaDiv = document.getElementById('flashcard-area');
        const navigationAreaDiv = document.getElementById('navigation-area');
        const chapterSelect = document.getElementById('chapter-select');
        const directionRadios = document.querySelectorAll('input[name="direction"]');
        const flashcard = document.getElementById('flashcard');
        const cardFrontContent = document.getElementById('card-front-content');
        const cardBackTranslation = document.getElementById('card-back-translation');
        const cardBackExample = document.getElementById('card-back-example');
        const speakFrontButton = document.getElementById('speak-front-button');
        const speakBackButton = document.getElementById('speak-back-button');
        const nextButton = document.getElementById('next-button');
        const prevButton = document.getElementById('prev-button');
        const shuffleButton = document.getElementById('shuffle-button');
        const cardCounter = document.getElementById('card-counter');
        const assessmentControls = document.getElementById('assessment-controls');
        const correctButton = document.getElementById('correct-button');
        const wrongButton = document.getElementById('wrong-button');
        const scoreDisplay = document.getElementById('score-display');
        const cardStatusDisplay = document.getElementById('card-status-display');

        // --- Game State ---
        let allVocabulary = [];
        let currentDeck = [];
        let currentCardIndex = 0;
        let currentDirection = 'eng-ger';
        let chapters = new Set();
        let backfaceUpdateTimeout = null;
        let ttsSupported = ('speechSynthesis' in window);

        // --- TTS Function ---
        /**
         * Speaks the given German word using the Web Speech API.
         * Includes logging for debugging.
         * @param {string} word The German word to speak.
         */
        function speakGermanWord(word) {
            console.log(`speakGermanWord called with: "${word}"`); // Log function entry
            if (!ttsSupported) {
                console.warn("TTS not supported.");
                // Optionally show a more persistent message to the user here
                if (!ttsWarningDiv.classList.contains('hidden')) { // Check if warning already shown
                    ttsWarningDiv.textContent = "Speech synthesis not supported by this browser.";
                    ttsWarningDiv.classList.remove('hidden');
                }
                return;
            }
             if (!word) {
                 console.warn("No word provided to speak.");
                 return;
             }

            // Optional: Log available voices (might be empty initially, call requires user interaction sometimes)
            // try { console.log("Available voices:", speechSynthesis.getVoices()); } catch (e) { console.warn("Could not get voices yet."); }

            speechSynthesis.cancel(); // Cancel previous speech

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'de-DE';
            utterance.rate = 0.9;

            // Add event listeners for debugging
            utterance.onstart = () => console.log(`Speech started for: "${word}"`);
            utterance.onend = () => console.log(`Speech ended for: "${word}"`);
            utterance.onerror = (event) => {
                console.error(`Speech error for "${word}":`, event.error);
                // Display error to user?
                ttsWarningDiv.textContent = `Speech error: ${event.error}`;
                ttsWarningDiv.classList.remove('hidden');
            };

            console.log("Calling speechSynthesis.speak...");
            try {
                 speechSynthesis.speak(utterance);
            } catch (error) {
                 console.error("Error calling speechSynthesis.speak:", error);
                 ttsWarningDiv.textContent = `Error starting speech: ${error.message}`;
                 ttsWarningDiv.classList.remove('hidden');
            }
        }

        // --- Utility Functions ---
        function shuffleArray(array) { /* ... */ for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }
        function parseCSV(csvText) { /* ... */ const lines = csvText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(line => line.trim() !== ''); if (lines.length < 2) return []; const headers = lines[0].split(',').map(h => h.trim()); const cI = headers.indexOf('chapter'); const sI = headers.indexOf('section'); const gI = headers.indexOf('word_german'); const eI = headers.indexOf('word_english'); const xI = headers.indexOf('example_sentence'); if ([cI, gI, eI, xI].includes(-1)) { console.error("CSV header missing required columns. Found:", headers); showError("Error parsing CSV. Check columns: 'chapter', 'word_german', 'word_english', 'example_sentence'."); return []; } const vocab = []; chapters.clear(); for (let i = 1; i < lines.length; i++) { const vals = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, '')); if (vals.length >= headers.length) { const gW = vals[gI]; const eW = vals[eI]; const chap = vals[cI]; if (chap && gW && eW) { vocab.push({ chapter: chap, section: vals[sI] || '', german: gW, english: eW, example: vals[xI] || '' }); if (chap) chapters.add(chap); } else { console.warn(`Skipping row ${i+1} due to missing essential data:`, lines[i]); } } else { console.warn(`Skipping row ${i+1} due to incorrect column count:`, lines[i]); } } return vocab; }
        function showError(message) { /* ... */ errorMessageDiv.textContent = message; errorMessageDiv.classList.remove('hidden'); loadingIndicator.classList.add('hidden'); controlsDiv.classList.add('hidden'); flashcardAreaDiv.classList.add('hidden'); navigationAreaDiv.classList.add('hidden'); }
        async function loadVocabulary() { /* ... */ loadingIndicator.classList.remove('hidden'); errorMessageDiv.classList.add('hidden'); ttsWarningDiv.classList.add('hidden'); controlsDiv.classList.add('hidden'); flashcardAreaDiv.classList.add('hidden'); navigationAreaDiv.classList.add('hidden'); if (!ttsSupported) { ttsWarningDiv.classList.remove('hidden'); } try { const r = await fetch(`${googleSheetCsvUrl}&t=${new Date().getTime()}`); if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`); const cT = await r.text(); if (!cT || cT.trim().split('\n').length < 2) { showError("Fetched data is empty or invalid."); return; } allVocabulary = parseCSV(cT); if (allVocabulary.length === 0 && !errorMessageDiv.textContent) { showError("No valid vocabulary data found in the sheet."); return; } else if (allVocabulary.length > 0) { populateChapterSelect(); if (!listenersAttached) setupEventListeners(); filterAndStartDeck(); loadingIndicator.classList.add('hidden'); controlsDiv.classList.remove('hidden'); flashcardAreaDiv.classList.remove('hidden'); navigationAreaDiv.classList.remove('hidden'); } } catch (e) { console.error('Error loading or parsing vocabulary:', e); showError(`Failed to load vocabulary data: ${e.message}`); } }
        function populateChapterSelect() { /* ... */ chapterSelect.innerHTML = '<option value="all">All Chapters</option>'; const sC = Array.from(chapters).sort((a, b) => { const nA = parseFloat(a); const nB = parseFloat(b); if (!isNaN(nA) && !isNaN(nB)) return nA - nB; return String(a).localeCompare(String(b), undefined, {numeric: true}); }); sC.forEach(ch => { const o = document.createElement('option'); o.value = ch; o.textContent = `Chapter ${ch}`; chapterSelect.appendChild(o); }); }
        function updateScoreDisplay() { /* ... */ let cS = 0, cTA = 0; currentDeck.forEach(c => { if (c.status === 'correct') { cS++; cTA++; } else if (c.status === 'wrong') { cTA++; } }); scoreDisplay.textContent = `Score: ${cS} / ${cTA}`; }
        function filterAndStartDeck() { /* ... */ const sCh = chapterSelect.value; let fV; if (sCh === 'all') { fV = [...allVocabulary]; } else { fV = allVocabulary.filter(w => String(w.chapter) === String(sCh)); } currentDeck = fV.map(c => ({ ...c, status: 'unattempted' })); if (currentDeck.length === 0) { if (sCh !== 'all') { showError(`No vocabulary found for Chapter ${sCh}.`); } else if (allVocabulary.length === 0) { showError("No vocabulary loaded at all."); } else { errorMessageDiv.classList.add('hidden'); } flashcardAreaDiv.classList.add('hidden'); navigationAreaDiv.classList.add('hidden'); cardCounter.textContent = "Card 0 of 0"; updateScoreDisplay(); return; } else { errorMessageDiv.classList.add('hidden'); flashcardAreaDiv.classList.remove('hidden'); navigationAreaDiv.classList.remove('hidden'); } shuffleArray(currentDeck); currentCardIndex = 0; updateScoreDisplay(); displayCard(); }

        function displayCard() { /* ... */ if (currentDeck.length === 0) { return; } currentCardIndex = Math.max(0, Math.min(currentCardIndex, currentDeck.length - 1)); const cD = currentDeck[currentCardIndex]; if (backfaceUpdateTimeout) { clearTimeout(backfaceUpdateTimeout); backfaceUpdateTimeout = null; } const eW = cD.english || "[Missing English]"; const gW = cD.german || "[Missing German]"; const xS = cD.example || '(No example sentence provided)'; let fW, bW, fIG, bIG; if (currentDirection === 'eng-ger') { fW = eW; bW = gW; fIG = false; bIG = true; } else { fW = gW; bW = eW; fIG = true; bIG = false; } cardFrontContent.textContent = fW; cardCounter.textContent = `Card ${currentCardIndex + 1} of ${currentDeck.length}`; updateScoreDisplay(); assessmentControls.classList.add('hidden-smooth'); cardStatusDisplay.classList.remove('visible-smooth', 'status-correct', 'status-wrong'); cardStatusDisplay.classList.add('hidden-smooth'); cardStatusDisplay.textContent = ''; flashcard.classList.remove('no-interaction'); speakFrontButton.classList.add('hidden'); speakBackButton.classList.add('hidden'); if (cD.status === 'unattempted') { flashcard.classList.remove('is-flipped'); if (fIG && ttsSupported) speakFrontButton.classList.remove('hidden'); backfaceUpdateTimeout = setTimeout(() => { cardBackTranslation.textContent = bW; cardBackExample.textContent = xS; if (bIG && ttsSupported) speakBackButton.classList.remove('hidden'); backfaceUpdateTimeout = null; }, 150); } else { flashcard.classList.add('is-flipped'); flashcard.classList.add('no-interaction'); cardBackTranslation.textContent = bW; cardBackExample.textContent = xS; if (bIG && ttsSupported) speakBackButton.classList.remove('hidden'); cardStatusDisplay.classList.remove('hidden-smooth'); cardStatusDisplay.classList.add('visible-smooth'); if (cD.status === 'correct') { cardStatusDisplay.textContent = '✓ Marked as Correct'; cardStatusDisplay.classList.add('status-correct'); cardStatusDisplay.classList.remove('status-wrong'); } else { cardStatusDisplay.textContent = '✗ Marked as Wrong'; cardStatusDisplay.classList.add('status-wrong'); cardStatusDisplay.classList.remove('status-correct'); } } prevButton.disabled = (currentCardIndex === 0); nextButton.disabled = (cD.status === 'unattempted' && flashcard.classList.contains('is-flipped')); }
        function goToNextCard() { /* ... */ if (currentDeck.length > 0) { currentCardIndex++; if (currentCardIndex >= currentDeck.length) { currentCardIndex = 0; } displayCard(); } }
        function goToPreviousCard() { /* ... */ if (currentDeck.length > 0) { currentCardIndex--; if (currentCardIndex < 0) { currentCardIndex = currentDeck.length - 1; } display(); } } // Corrected typo: displayCard()
        function handleFlip() { /* ... */ if (currentDeck.length > 0 && currentDeck[currentCardIndex].status === 'unattempted' && !flashcard.classList.contains('is-flipped')) { if (backfaceUpdateTimeout) { clearTimeout(backfaceUpdateTimeout); const cD = currentDeck[currentCardIndex]; const gW = cD.german || "[Missing German]"; const eW = cD.english || "[Missing English]"; const xS = cD.example || '(No example sentence provided)'; const bW = (currentDirection === 'eng-ger') ? gW : eW; const bIG = (currentDirection === 'eng-ger'); cardBackTranslation.textContent = bW; cardBackExample.textContent = xS; speakBackButton.classList.toggle('hidden', !(bIG && ttsSupported)); backfaceUpdateTimeout = null; } flashcard.classList.add('is-flipped'); assessmentControls.classList.remove('hidden-smooth'); nextButton.disabled = true; flashcard.classList.add('no-interaction'); } }
        function handleAssessment(wasCorrect) { /* ... */ if (currentDeck.length > 0) { const cD = currentDeck[currentCardIndex]; if (cD.status === 'unattempted') { cD.status = wasCorrect ? 'correct' : 'wrong'; updateScoreDisplay(); goToNextCard(); } else { console.warn("Attempted to assess an already assessed card."); goToNextCard(); } } }

        // --- Event Listener Setup ---
        let listenersAttached = false;
        function setupEventListeners() {
             if (listenersAttached) return;
             flashcard.addEventListener('click', handleFlip);
             nextButton.addEventListener('click', goToNextCard);
             prevButton.addEventListener('click', goToPreviousCard);
             shuffleButton.addEventListener('click', () => { filterAndStartDeck(); });
             chapterSelect.addEventListener('change', filterAndStartDeck);
             directionRadios.forEach(radio => { radio.addEventListener('change', (event) => { currentDirection = event.target.value; if (currentDeck.length > 0) { displayCard(); } }); });
             correctButton.addEventListener('click', () => handleAssessment(true));
             wrongButton.addEventListener('click', () => handleAssessment(false));

             // Add listeners for Speak buttons with logging
             speakFrontButton.addEventListener('click', (event) => {
                 console.log("Speak Front Button clicked"); // Log click
                 event.stopPropagation(); // Prevent card flip
                 if (currentDeck.length > 0) {
                     const wordToSpeak = currentDeck[currentCardIndex].german;
                     console.log("Attempting to speak (front):", wordToSpeak); // Log word
                     speakGermanWord(wordToSpeak);
                 } else {
                     console.log("No current deck to speak from (front)");
                 }
             });
             speakBackButton.addEventListener('click', (event) => {
                 console.log("Speak Back Button clicked"); // Log click
                 event.stopPropagation(); // Prevent card flip
                 if (currentDeck.length > 0) {
                      const wordToSpeak = currentDeck[currentCardIndex].german;
                      console.log("Attempting to speak (back):", wordToSpeak); // Log word
                      speakGermanWord(wordToSpeak);
                 } else {
                      console.log("No current deck to speak from (back)");
                 }
             });

             listenersAttached = true; console.log("Event listeners attached.");
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', loadVocabulary);

    </script>

</body>
