<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Verb Drop Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Use Inter font */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrollbars from game elements */
        }
        /* Style for falling verb elements */
        .verb-drop {
            position: absolute;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, transform 0.2s ease, top 0.05s linear; /* Faster top transition for smoother movement */
            user-select: none; /* Prevent text selection */
            min-width: 80px; /* Ensure minimum width */
            text-align: center;
            padding: 8px 12px; /* Add padding */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); /* shadow-md */
            background-color: #ffffff; /* bg-white */
            border: 1px solid #e5e7eb; /* border border-gray-200 */
            white-space: nowrap; /* Prevent long words from wrapping */
        }
        .verb-drop:hover {
            transform: scale(1.05);
            background-color: #f3f4f6; /* hover:bg-gray-100 */
        }
        /* Style for the game area */
        #game-area {
            position: relative;
            height: 400px; /* Adjust height as needed */
            border: 2px solid #d1d5db; /* border-2 border-gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            background-color: #f9fafb; /* bg-gray-50 */
            overflow: hidden; /* Keep falling elements inside */
            margin-top: 1rem; /* mt-4 */
        }
        /* Simple animation for feedback */
        @keyframes feedback-correct {
            0% { background-color: #d1fae5; } /* bg-green-100 */
            100% { background-color: #ebf5ff; } /* Back to default bg-blue-50 */
        }
        @keyframes feedback-incorrect {
            0% { background-color: #fee2e2; } /* bg-red-100 */
            100% { background-color: #ebf5ff; } /* Back to default bg-blue-50 */
        }
        .feedback-correct {
            animation: feedback-correct 0.5s ease-out;
        }
        .feedback-incorrect {
            animation: feedback-incorrect 0.5s ease-out;
        }
        /* Style for active mode button */
        .mode-button.active {
            background-color: #3b82f6; /* bg-blue-600 */
            color: white;
            font-weight: 600; /* semibold */
        }
         /* Default background for verb display */
        #verb-display {
             background-color: #ebf5ff; /* bg-blue-50 - lighter blue */
        }
        /* Lives display */
        .lives-heart {
             color: #ef4444; /* red-500 */
             display: inline-block;
             font-size: 1.1em; /* Slightly larger heart */
             margin-left: 2px;
        }
        /* Ensure the given info display takes adequate height */
        #given-verb-info {
            min-height: 28px; /* Adjust as needed based on font size */
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">German Verb Drop Game</h1>

        <div class="mb-4 flex justify-center space-x-2">
            <button data-mode="infinitive" class="mode-button px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 transition duration-150">Infinitive</button>
            <button data-mode="praeteritum" class="mode-button px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 transition duration-150">Präteritum</button>
            <button data-mode="partizip" class="mode-button px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 transition duration-150">Partizip Perfekt</button>
            <button data-mode="mixed" class="mode-button active px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-100 transition duration-150">Mixed</button>
        </div>

        <div id="verb-display" class="text-center p-4 rounded-md mb-4 border border-blue-300 grid grid-cols-2 gap-2 items-center">
             <div>
                <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">Meaning</p>
                <p class="text-xl font-semibold text-blue-800 mt-1" id="given-verb-info">-</p>
                <p class="text-sm text-gray-600" id="given-verb-english"></p>
            </div>
            <div class="border-l border-blue-200 pl-3">
                <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">Find</p>
                <p class="text-xl font-bold text-purple-700 mt-1" id="target-form-type">-</p>
            </div>
        </div>


        <div class="flex justify-between items-center mb-4">
             <div class="text-lg font-semibold text-gray-700 flex items-center space-x-4">
                <span>Score: <span id="score" class="text-green-600 font-bold">0</span></span>
                <span>Lives: <span id="lives" class="font-bold"></span></span>
                 </div>
            <button id="start-button" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow transition duration-150 ease-in-out">
                Start Game
            </button>
        </div>

        <div id="message-area" class="text-center h-6 mb-2 text-lg font-medium"></div>

        <div id="game-area">
            </div>
    </div>

    <script>
        // --- Game Data ---
        const verbs = [
            { infinitive: "anfangen", praeteritum: "fing an", partizip: "angefangen", english: "to begin" },
            { infinitive: "antworten", praeteritum: "antwortete", partizip: "geantwortet", english: "to answer" },
            { infinitive: "arbeiten", praeteritum: "arbeitete", partizip: "gearbeitet", english: "to work" },
            { infinitive: "ärgern", praeteritum: "ärgerte", partizip: "geärgert", english: "to annoy" },
            { infinitive: "aufräumen", praeteritum: "räumte auf", partizip: "aufgeräumt", english: "to clean up" },
            { infinitive: "aufwachen", praeteritum: "wachte auf", partizip: "aufgewacht", english: "to wake up" },
            { infinitive: "aussehen", praeteritum: "sah aus", partizip: "ausgesehen", english: "to look like" },
            { infinitive: "baden", praeteritum: "badete", partizip: "gebadet", english: "to bathe" },
            { infinitive: "bauen", praeteritum: "baute", partizip: "gebaut", english: "to build" },
            { infinitive: "beeilen", praeteritum: "beeilte", partizip: "beeilt", english: "to hurry" },
            { infinitive: "beginnen", praeteritum: "begann", partizip: "begonnen", english: "to begin" },
            { infinitive: "bekommen", praeteritum: "bekam", partizip: "bekommen", english: "to get, receive" },
            { infinitive: "bestellen", praeteritum: "bestellte", partizip: "bestellt", english: "to order" },
            { infinitive: "besuchen", praeteritum: "besuchte", partizip: "besucht", english: "to visit" },
            { infinitive: "beten", praeteritum: "betete", partizip: "gebetet", english: "to pray" }
        ];
        const INITIAL_LIVES = 5;
        const MIN_HORIZONTAL_SEPARATION = 60; // Minimum pixels between edges of falling words

        // --- DOM Elements ---
        const gameArea = document.getElementById('game-area');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const givenVerbInfoDisplay = document.getElementById('given-verb-info');
        const givenVerbEnglishDisplay = document.getElementById('given-verb-english'); // Kept reference, but cleared
        const targetFormTypeDisplay = document.getElementById('target-form-type');
        const startButton = document.getElementById('start-button');
        const messageArea = document.getElementById('message-area');
        const verbDisplayArea = document.getElementById('verb-display');
        const modeButtons = document.querySelectorAll('.mode-button');

        // --- Game State ---
        let score = 0;
        let lives = INITIAL_LIVES;
        let currentVerb = null;
        let targetFormType = '';
        let targetFormValue = '';
        let fallingVerbs = []; // Stores { element, isCorrect, form, y, x, width }
        let gameLoopInterval = null;
        let isGameRunning = false;
        let isGameOver = false;
        let fallSpeed = 1.5;
        let roundInProgress = false;
        let gameMode = 'mixed';

        // --- Game Logic ---

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function getRandomVerb(excludeInfinitive = null) {
            let newVerb;
            do {
                newVerb = verbs[getRandomInt(0, verbs.length)];
            } while (excludeInfinitive && newVerb.infinitive === excludeInfinitive);
            return newVerb;
        }

        function getDistractors(correctVerb, formTypeToGet, count) {
            const distractors = new Set();
            const correctFormValue = correctVerb[formTypeToGet];
            while (distractors.size < count && distractors.size < verbs.length - 1) {
                const randomVerb = getRandomVerb(correctVerb.infinitive);
                const distractorForm = randomVerb[formTypeToGet];
                if (distractorForm && distractorForm !== correctFormValue) {
                    distractors.add(distractorForm);
                }
            }
            return Array.from(distractors);
        }

        // Update lives display using heart icons
        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < lives; i++) {
                hearts += '<span class="lives-heart">♥</span>';
            }
             for (let i = lives; i < INITIAL_LIVES; i++) {
                 hearts += '<span class="lives-heart text-gray-300">♥</span>';
             }
            livesDisplay.innerHTML = hearts;
        }

        // Create a falling verb element with overlap avoidance
        function createFallingVerbElement(verbForm, isCorrect) {
            const verbElement = document.createElement('div');
            verbElement.classList.add('verb-drop');
            verbElement.textContent = verbForm;

            document.body.appendChild(verbElement);
            const elementWidth = verbElement.offsetWidth;
            document.body.removeChild(verbElement);

            const gameAreaWidth = gameArea.offsetWidth;
            const maxLeft = gameAreaWidth > elementWidth + 20 ? gameAreaWidth - elementWidth - 10 : 5;

            let potentialLeft;
            let attempts = 0;
            let positionFound = false;

            while (attempts < 10 && !positionFound) {
                potentialLeft = getRandomInt(10, maxLeft);
                positionFound = true;
                for (const existingVerb of fallingVerbs) {
                    const existingRight = existingVerb.x + existingVerb.width;
                    const potentialRight = potentialLeft + elementWidth;
                    if (potentialLeft < existingRight + MIN_HORIZONTAL_SEPARATION &&
                        potentialRight > existingVerb.x - MIN_HORIZONTAL_SEPARATION) {
                        positionFound = false;
                        break;
                    }
                }
                attempts++;
            }
             if (!positionFound) {
                 potentialLeft = getRandomInt(10, maxLeft);
             }

            verbElement.style.left = `${potentialLeft}px`;
            verbElement.style.top = `-${getRandomInt(30, 100)}px`;
            verbElement.dataset.correct = isCorrect;
            verbElement.dataset.form = verbForm;
            verbElement.addEventListener('click', handleVerbClick);
            gameArea.appendChild(verbElement);

            return {
                element: verbElement,
                isCorrect: isCorrect,
                form: verbForm,
                y: parseFloat(verbElement.style.top) || 0,
                x: potentialLeft,
                width: elementWidth
            };
        }

        // Handle losing a life
        function loseLife() {
            if (!isGameRunning) return;
            lives--;
            updateLivesDisplay();
            verbDisplayArea.classList.add('feedback-incorrect');
            setTimeout(() => verbDisplayArea.classList.remove('feedback-incorrect'), 500);
            if (lives <= 0) {
                gameOver();
            }
        }

        // Handle clicking on a falling verb
        function handleVerbClick(event) {
            if (!isGameRunning || !roundInProgress || isGameOver) return;

            const clickedElement = event.target;
            const isCorrect = clickedElement.dataset.correct === 'true';

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
                messageArea.textContent = 'Correct! Gut gemacht!';
                messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-green-600';
                verbDisplayArea.classList.add('feedback-correct');
                setTimeout(() => verbDisplayArea.classList.remove('feedback-correct'), 500);
                clickedElement.style.backgroundColor = '#a7f3d0';
                clickedElement.style.borderColor = '#059669';
                clickedElement.style.fontWeight = 'bold';

                roundInProgress = false;
                setTimeout(clearFallingVerbs, 300);
                setTimeout(nextRound, 1000);

            } else {
                messageArea.textContent = `Incorrect! It was: ${targetFormValue}`;
                messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-red-600';
                clickedElement.style.backgroundColor = '#fee2e2';
                clickedElement.style.borderColor = '#dc2626';
                loseLife();

                if (!isGameOver) {
                    roundInProgress = false;
                    setTimeout(clearFallingVerbs, 300);
                    setTimeout(nextRound, 1500);
                } else {
                     clearFallingVerbs();
                }
            }
        }

        // Clear all falling verb elements
        function clearFallingVerbs() {
            fallingVerbs.forEach(item => item.element.remove());
            fallingVerbs = [];
        }

        // Start the next round based on gameMode
        function nextRound() {
            if (!isGameRunning || isGameOver) return;

            clearFallingVerbs();
            messageArea.textContent = '';
            roundInProgress = true;

            currentVerb = getRandomVerb(currentVerb ? currentVerb.infinitive : null);

            // --- MODIFICATION START ---
            // Always use English meaning as the primary clue
            const givenInfo = `"${currentVerb.english}"`; // Add quotes for clarity
            const givenEnglish = ''; // Clear the secondary line
            // --- MODIFICATION END ---

            let targetTypeDisplay = '';
            let formTypeForFallingWords = '';

            // Determine the target form based on mode
            switch (gameMode) {
                 case 'infinitive':
                    targetFormType = 'infinitive';
                    targetTypeDisplay = 'Infinitive';
                    formTypeForFallingWords = 'infinitive';
                    break;
                case 'praeteritum':
                    targetFormType = 'praeteritum';
                    targetTypeDisplay = 'Präteritum';
                    formTypeForFallingWords = 'praeteritum';
                    break;
                case 'partizip':
                    targetFormType = 'partizip';
                    targetTypeDisplay = 'Partizip Perfekt';
                    formTypeForFallingWords = 'partizip';
                    break;
                case 'mixed':
                default:
                    targetFormType = Math.random() < 0.5 ? 'praeteritum' : 'partizip';
                    targetTypeDisplay = (targetFormType === 'praeteritum') ? 'Präteritum' : 'Partizip Perfekt';
                    formTypeForFallingWords = targetFormType;
                    break;
            }

            targetFormValue = currentVerb[targetFormType];

            // Update the display area with the determined info
            givenVerbInfoDisplay.textContent = givenInfo;
            givenVerbEnglishDisplay.textContent = givenEnglish; // Set secondary line to empty
            targetFormTypeDisplay.textContent = targetTypeDisplay;

            // Create falling verbs
            const distractors = getDistractors(currentVerb, formTypeForFallingWords, getRandomInt(2, 4));
            const allFallingForms = [targetFormValue, ...distractors];
            allFallingForms.sort(() => Math.random() - 0.5);

            let spawnDelay = 0;
            allFallingForms.forEach((form) => {
                setTimeout(() => {
                     if (!roundInProgress || isGameOver) return;
                    const isCorrect = form === targetFormValue;
                    const verbData = createFallingVerbElement(form, isCorrect);
                    if(verbData) {
                        fallingVerbs.push(verbData);
                    }
                }, spawnDelay);
                spawnDelay += getRandomInt(400, 900);
            });
        }


        // Main game loop
        function gameLoop(timestamp) {
            if (!isGameRunning || isGameOver) return;

            const gameAreaHeight = gameArea.offsetHeight;
            const verbsToRemove = [];

            fallingVerbs.forEach((item, index) => {
                item.y += fallSpeed;
                item.element.style.top = `${item.y}px`;

                if (item.y + item.element.offsetHeight >= gameAreaHeight) {
                    verbsToRemove.push(index);
                    item.element.remove();

                    if (item.isCorrect && roundInProgress) {
                        messageArea.textContent = `Missed! It was: ${targetFormValue}`;
                        messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-orange-600';
                        loseLife();
                        if (!isGameOver) {
                            roundInProgress = false;
                            setTimeout(clearFallingVerbs, 300);
                            setTimeout(nextRound, 1500);
                        } else {
                            clearFallingVerbs();
                        }
                    }
                }
            });

            for (let i = verbsToRemove.length - 1; i >= 0; i--) {
                fallingVerbs.splice(verbsToRemove[i], 1);
            }

            if (isGameRunning && !isGameOver) {
                 gameLoopInterval = requestAnimationFrame(gameLoop);
            }
        }

         // Game Over function
        function gameOver() {
            isGameRunning = false;
            isGameOver = true;
            roundInProgress = false;
            if (gameLoopInterval) {
                cancelAnimationFrame(gameLoopInterval);
                gameLoopInterval = null;
            }
            clearFallingVerbs();

            messageArea.textContent = `Game Over! Final Score: ${score}`;
            messageArea.className = 'text-center h-6 mb-2 text-xl font-bold text-red-600';

            startButton.textContent = 'Restart Game';
            startButton.classList.replace('bg-red-500', 'bg-green-500');
            startButton.classList.replace('hover:bg-red-600', 'hover:bg-green-600');

             givenVerbInfoDisplay.textContent = '---';
             givenVerbEnglishDisplay.textContent = ''; // Ensure secondary line is empty on game over too
             targetFormTypeDisplay.textContent = '---';
        }


        // Start the game (or restart)
        function startGame() {
            score = 0;
            lives = INITIAL_LIVES;
            isGameOver = false;
            isGameRunning = true;
            roundInProgress = false;

            scoreDisplay.textContent = score;
            updateLivesDisplay();

            startButton.textContent = 'Stop Game';
            startButton.classList.remove('bg-blue-500', 'bg-green-500', 'hover:bg-blue-600', 'hover:bg-green-600');
            startButton.classList.add('bg-red-500', 'hover:bg-red-600');

            clearFallingVerbs();
            messageArea.textContent = '';
             if (gameLoopInterval) {
                cancelAnimationFrame(gameLoopInterval);
            }

            nextRound();
            gameLoopInterval = requestAnimationFrame(gameLoop);
        }

        // Stop the game (manual stop, not game over)
        function stopGame() {
             if (!isGameRunning || isGameOver) return;

            isGameRunning = false;
            roundInProgress = false;
            startButton.textContent = 'Start Game';
             startButton.classList.remove('bg-red-500', 'bg-green-500', 'hover:bg-red-600', 'hover:bg-green-600');
             startButton.classList.add('bg-blue-500', 'hover:bg-blue-600');

            if (gameLoopInterval) {
                cancelAnimationFrame(gameLoopInterval);
                gameLoopInterval = null;
            }

            clearFallingVerbs();
            givenVerbInfoDisplay.textContent = '-';
            givenVerbEnglishDisplay.textContent = ''; // Ensure secondary line is empty when stopped
            targetFormTypeDisplay.textContent = '-';
            messageArea.textContent = 'Game stopped. Select a mode and start again!';
            messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-gray-500';
        }

        // --- Event Listeners ---
        startButton.addEventListener('click', () => {
            if (isGameOver) {
                startGame();
            } else if (isGameRunning) {
                stopGame();
            } else {
                startGame();
            }
        });

        // Mode selection listener
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (isGameRunning) {
                     messageArea.textContent = 'Stop the game to change mode!';
                     messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-orange-500';
                     setTimeout(() => { if(!isGameRunning && !isGameOver) messageArea.textContent = '';}, 2000);
                    return;
                }

                 if (isGameOver) {
                     isGameOver = false;
                     startButton.textContent = 'Start Game';
                     startButton.classList.remove('bg-green-500', 'hover:bg-green-600');
                     startButton.classList.add('bg-blue-500', 'hover:bg-blue-600');
                     updateLivesDisplay();
                 }

                gameMode = button.dataset.mode;
                modeButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                givenVerbInfoDisplay.textContent = '-';
                givenVerbEnglishDisplay.textContent = ''; // Ensure secondary line is empty on mode change
                targetFormTypeDisplay.textContent = '-';
                messageArea.textContent = `Mode set to ${gameMode}. Click Start Game!`;
                messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-gray-500';

                console.log("Game mode changed to:", gameMode);
            });
        });

         // Initial setup
        updateLivesDisplay();
        messageArea.textContent = 'Select a mode and click "Start Game"!';
        messageArea.className = 'text-center h-6 mb-2 text-lg font-medium text-gray-500';
        givenVerbInfoDisplay.textContent = '-'; // Initial state
        givenVerbEnglishDisplay.textContent = ''; // Initial state empty

    </script>

</body>
</html>
